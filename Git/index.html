Git commands

git clone url - git clone command is used to clone a project into our local system from the github website 
for eg if we have to clone a project which is there on our github website then we can do it  by just writing
 git clone url 

 git status command - git status command Command is used to check the status of the code 

 There are 5 status types

 1. untracked : this are the files which git doesn' know & it is not tracking at all so if we want git to 
 track this files then we will add the file using git add command

 2. unmodified - this are which files in which we didnt make any changes

 3. modified - this are the files which are modified eg we have made any changes in the code

 4. staged - once the file is modified we have to stage the file inorder to do the final commit or save the files

 5. commit - commit is the final step which is save the file & we commit the git files by writing this command
                git commit -m "message";   -->

<!-- 1. What is a Branch in Git?
A branch is a separate version of your project where you can work on new features or make changes without affecting your original code.

Think of it like this:

Suppose you are building a website.

Your main website is working perfectly. Now you want to add a login page.

Instead of directly changing your main project, you create a separate branch and work there.

If everything works perfectly, you can merge that branch into the main branch. -->
